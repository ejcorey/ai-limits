plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.yuhee.ailimits'
    compileSdk 35

    defaultConfig {
        applicationId "dev.yuhee.ailimits"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Local keystore is not committed; clones without it get an unsigned release build.
    def ks = rootProject.file('keystore.jks')
    signingConfigs {
        release {
            storeFile ks
            storePassword "aiusage-local"
            keyAlias "aiusage"
            keyPassword "aiusage-local"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
